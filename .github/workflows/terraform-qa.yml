
name: Terraform QA Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-qa
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true

jobs:

  # ==========================================
  # JOB 1: TERRAFORM PLAN
  # ==========================================

  terraform-plan:
    name: Terraform QA Plan
    runs-on: ubuntu-latest
    environment: qa

    defaults:
      run:
        working-directory: environments/qa

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using QA OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_QA_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
        working-directory: .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Terraform Format
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-qa-plan
          path: environments/qa/tfplan
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # JOB 2: TERRAFORM APPLY
  # ==========================================

  terraform-apply:
    name: Terraform QA Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: qa

    defaults:
      run:
        working-directory: environments/qa

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using QA OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_QA_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
        working-directory: .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-qa-plan
          path: environments/qa

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan