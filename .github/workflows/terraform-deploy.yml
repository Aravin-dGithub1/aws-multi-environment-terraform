
name: Terraform Dev Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_IN_AUTOMATION: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Display repository identity for OIDC troubleshooting
      - name: Display GitHub repository identity
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Branch: ${{ github.ref }}"

      # Step 3: Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 4: Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 5: Check Terraform formatting
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # Step 6: Initialize Terraform and S3 backend
      - name: Terraform Init
        run: terraform init

      # Step 7: Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 8: Generate Terraform execution plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 9: Upload plan for review
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: tfplan
          retention-days: 1
